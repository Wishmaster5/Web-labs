<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="circle-wrapper size-large">
      <div class="circle circle-border"></div>

      <div class="circle circle-progress">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <!-- Радиус изменен на 71, чтобы идеально совпасть с CSS-границей (150/2 - 8/2 = 71) -->
          <circle class="background-circle" cx="75" cy="75" r="71"></circle>
          <circle class="progress-circle" cx="75" cy="75" r="71"></circle>
        </svg>
      </div>
    </div>

    <div class="circle-wrapper size-medium">
      <div class="circle circle-border"></div>

      <div class="circle circle-progress">
        <svg width="150" height="150" viewBox="0 0 150 150">

          <circle class="background-circle" cx="75" cy="75" r="71"></circle>
          <circle class="progress-circle" cx="75" cy="75" r="71"></circle>
        </svg>
      </div>
    </div>

    <div class="circle-wrapper size-small">
      <div class="circle circle-border"></div>

      <div class="circle circle-progress">
        <svg width="150" height="150" viewBox="0 0 150 150">

          <circle class="background-circle" cx="75" cy="75" r="71"></circle>
          <circle class="progress-circle" cx="75" cy="75" r="71"></circle>
        </svg>
      </div>
    </div>
  </body>
</html>
