<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шашки</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-container fade-in">
      <h1 class="slide-in">Шашки</h1>

      <div class="game-info">
        <div>Turn:</div>
        <div class="turn-indicator">
          <div id="turn-dot" class="turn-dot white-turn"></div>
          <span id="current-turn">White</span>
          <div id="thinking-indicator" class="thinking-indicator">
            <div class="thinking-dot"></div>
            <div class="thinking-dot"></div>
            <div class="thinking-dot"></div>
          </div>
        </div>
      </div>
      <div class="board" id="board"></div>
      <div class="controls">
        <button id="reset-btn">New Game</button>
        <button id="back-btn" style="display: none">Back to Menu</button>
      </div>
    </div>
    <div id="game-message" class="game-message"></div>
    <script src="script.js"></script>
  </body>
</html>
